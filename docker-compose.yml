services:
  api:
    build: .
    command: uvicorn app.api.app:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  bot:
    build: .
    command: python -m app.bots.run_bot
    env_file:
      - .env
    volumes:
     - ./data:/app/data
    restart: unless-stopped